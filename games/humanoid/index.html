<style>
:root{--bg:#1d2238;--panel:#262c47ee;--line:#454d74;--text:#eef0f8;--mute:#a7abc6;--gold:#ffd25a;--ok:#3fb950;--blue:#2f6bff;--red:#e5483b}

#view{position:absolute;inset:0;outline:none}

.btn:hover{background:#474f7a}
.btn.pri{background:linear-gradient(90deg,#ffd25a,#ff8f5a);color:#2a1d05;border-color:transparent}

#hud .tm small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:-3px}
#hud .a{background:var(--blue);border-radius:10px 0 0 10px}#hud .b{background:var(--red);border-radius:0 10px 10px 0}

#side .row:first-child{border-top:0}

table.k td{border-bottom:1px solid #ffffff12;padding:4px 3px;vertical-align:top}

.card .note{color:var(--mute);font-size:12px}
.card .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

import * as THREE from 'three';

{

/* ---------------- 입력 ---------------- */
const KEY = new Set();

    if (atk) { b.attack(atk); continue; }

/* ---------------- 가상 상대 AI ---------------- */
const AI = (() => {

  else beep(220, 0.12, 0.08, 'sawtooth');
  def.kb = [ux * 0.25 * pow, uz * 0.25 * pow, 0.22];
  const pDown = clamp(0.08 + 0.42 * (pow - def.stability()), 0.03, 0.9);
  if (Math.random() < pDown) {
    const f = def.fwd(), facing = f[0] * ux + f[1] * uz; // 상대가 앞에서 맞으면(밀림 방향과 반대를 봄) 뒤로 넘어짐
    def.knockDown(facing < 0 ? -1 : 1);
    let n = 1, why = A.name + ' — 다운';
    if (A.kick && !att.critUsed && pow > 1.9) { n = 2; att.critUsed = true; why = A.name + ' — 크리티컬 어택(2다운)'; }
    point(att.team, n, why);
    if (G.phase === 'play') G.ko = { who: def, t: 0 };
  }
}
function separate() {
  const dx = op.x - me.x, dz = op.z - me.z, d = Math.hypot(dx, dz), minD = 0.115;
  if (d < minD && !me.fallen && !op.fallen) { const k = (minD - d) / 2 / (d || 1); me.x -= dx * k; me.z -= dz * k; op.x += dx * k; op.z += dz * k; }
}
function ringCheck(b, dt) {
  const half = RULE.arena / 2;
  if (b.out) { b.outT = (b.outT || 0) + dt * 2.5; return; }
  let x = b.x, z = b.z;
  if (Math.abs(b.tiltA) > 0.8) { const f = b.fwd(), d = Math.sign(b.tiltA); x += f[0] * 0.18 * d; z += f[1] * 0.18 * d; } // 누운 몸의 가운데
  if (Math.abs(b.x) > half || Math.abs(b.z) > half || (b.fallen && (Math.abs(x) > half + 0.05 || Math.abs(z) > half + 0.05))) {
    b.out = true; b.outT = 0; b.mot = null; b.walk = null;
    if (G.phase === 'play') { point(1 - b.team, 1, '링아웃'); G.ko = null; if (G.phase === 'play') { G.phase = 'restart'; G.restartT = 0; } }
  }
}

/* ---------------- 카메라 ---------------- */
const CAMS = ['oblique', 'side', 'behind', 'top', 'free'], CAMNAME = { oblique: '비스듬히', side: '중계 (옆)', behind: '내 로봇 뒤', top: '탑뷰', free: '자유 (마우스)' };
let camMode = 'oblique', camSnap = true; const camP = new THREE.Vector3(), camT = new THREE.Vector3();
function cycleCam() { camMode = CAMS[(CAMS.indexOf(camMode) + 1) % CAMS.length]; controls.enabled = camMode === 'free'; camSnap = true; $('#cam').textContent = '📷 ' + CAMNAME[camMode] + ' (C · View)'; }
function updateCam(dt) {
  if (camMode === 'free') { controls.update(); return; }
  const mx = (me.x + op.x) / 2, mz = (me.z + op.z) / 2, T = new THREE.Vector3(), Pp = new THREE.Vector3(), y0 = RULE.platH;
  if (camMode === 'oblique') { T.set(mx * 0.7, y0 + 0.14, mz * 0.7); Pp.set(mx * 0.7 + 0.62, y0 + 0.78, mz * 0.7 + 0.92); }
  else if (camMode === 'side') { T.set(mx * 0.6, y0 + 0.16, mz * 0.6); Pp.set(mx * 0.6, y0 + 0.62, 1.25 + mz * 0.3); }
  else if (camMode === 'top') { T.set(0, y0, 0); Pp.set(0, 2.05, 0.25); }
  else { const f = me.fwd(); T.set(op.x, y0 + 0.17, op.z); Pp.set(me.x - f[0] * 0.55, y0 + 0.45, me.z - f[1] * 0.55); }
  const k = camSnap ? 1 : 1 - Math.exp(-dt * 4); camSnap = false; camP.lerp(Pp, k); camT.lerp(T, k); camera.position.copy(camP); camera.lookAt(camT);
}

/* ---------------- 루프 ---------------- */
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const IN = readInput();
  if (!G.paused) tick(dt, IN);
  me.sync(); op.sync(); updateCam(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.1) { hudT = 0; hud(IN); }
  requestAnimationFrame(frame);
}
function tick(dt, IN) {
  G.t += dt;
  if (G.phase === 'count') { const n = 3 - Math.floor(G.t); if (G.t >= 3) { G.phase = 'play'; banner('파이트!', 0.9); beep(880, 0.3, 0.06, 'sine'); } else if (Math.floor(G.t - dt) !== Math.floor(G.t)) { banner(String(n), 0.8); beep(600, 0.1); } }
  const live = G.phase === 'play' || G.phase === 'free';
  if (live) { control(me, IN); control(op, aiThink(op, me, dt)); }
  me.step(dt); op.step(dt); separate();
  if (live) { hitCheck(me, op); hitCheck(op, me); }
  for (const b of [me, op]) ringCheck(b, dt);
  if (G.phase === 'play') {
    G.clock -= dt;
    // KO 카운트: 다운 뒤 10카운트 안에 일어서지 못하면 KO
    if (G.ko) { const b = G.ko.who; if (!b.fallen) G.ko = null; else { G.ko.t += dt; if (G.ko.t >= RULE.count + 1) end(b.team === 0 ? 'loss' : 'win', 'KO (10카운트)'); } }
    // 스탠딩 다운: 5초 넘게 움직이지 않음
    for (const b of [me, op]) { b.idleT = (b.mot && b.mot.idx !== 101) || b.fallen ? 0 : b.idleT + dt; if (b.idleT > RULE.idle) { b.idleT = 0; point(1 - b.team, 1, `${b.name} 스탠딩 다운 (5초 정지)`); } }
    if (G.clock <= 0 && G.phase === 'play') {
      G.clock = 0;
      if (G.score[0] !== G.score[1]) end(G.score[0] > G.score[1] ? 'win' : 'loss', '판정 (다운 수)');
      else if (MODE === 'match' && !G.ot) { G.ot = true; G.clock = RULE.ot; banner('동점 — 1분 연장 (골든 다운)', 2); }
      else end('draw', G.ot ? '연장 무승부' : '시간 종료 · 동점');
    }
  }
  if (G.phase === 'restart') { G.restartT += dt; if (G.restartT > 2) { placeStart(); G.phase = 'count'; G.t = 0; } }
}
function hud(IN) {
  $('#sA').textContent = G.score[0]; $('#sB').textContent = G.score[1];
  $('#clock').textContent = fmt(G.clock);
  $('#per').textContent = { idle: '대기', count: '준비', play: G.ot ? '연장 (골든 다운)' : '정규 3분', restart: '재시작', end: '경기 종료' }[G.phase] || '';
  const ko = G.ko && G.ko.who.fallen && G.phase === 'play' ? Math.floor(G.ko.t) : 0;
  const c = $('#count'); if (ko >= 1) { c.style.display = 'block'; c.innerHTML = `${ko}<small>${G.ko.who === me ? (SET.autoUp ? '일어서는 중…' : 'Y 버튼으로 일어서세요!') : '상대 다운'}</small>`; } else c.style.display = 'none';
  const st = b => b.fallen ? (b.getup ? '일어나는 중' : '다운') : b.out ? '링아웃' : b.mot ? (b.mot.kind === 'atk' ? '공격 · ' + ATK[b.mot.idx].name : b.mot.kind === 'block' ? '막기' : b.walk ? '걷기' : MOVE[b.mot.idx] ? '이동' : '서기') : '서기';
  $('#side').innerHTML = `<div class="row"><span>내 로봇 (파랑)</span><b>${st(me)}</b></div><div class="row"><span>상대 (빨강) · ${1 + Math.round(LEVEL * 4)}단계</span><b>${st(op)}</b></div>
    <div class="row"><span>거리</span><b>${(dist(me, op) * 100).toFixed(0)} cm</b></div>
    <div class="row"><span>크리티컬 어택</span><b>${me.critUsed ? '사용함' : '남음 (킥 다운 2점)'}</b></div>
    <div class="msg">${me.fallen && !me.getup ? (SET.autoUp ? '⚠ 다운! 곧 일어섭니다 (Y로 바로)' : '⚠ 다운! Y 버튼(I 키)으로 일어서세요') : me.idleT > 3 ? '⚠ 5초 넘게 멈추면 스탠딩 다운' : ''}</div>`;
  $('#pad').classList.toggle('on', IN.pad); $('#padTxt').textContent = IN.pad ? '🎮 엑스박스 컨트롤러 연결됨' : '컨트롤러 없음 — 키보드 사용 (버튼을 한 번 누르면 연결)';
}

/* ---------------- 시작 카드 · 도움말 ---------------- */
const KEYS = [
  ['D패드 ↑ / ↓', '앞으로 · 뒤로 걷기 (150·152·154 / 155·157·159)', 'W / S'],
  ['RT + D패드 ↑ / ↓', '빠르게 걷기 (160~169)', 'Shift'],
  ['D패드 ← / →', '제자리 왼쪽 · 오른쪽 돌기 (141 / 140)', 'A / D'],
  ['LT + D패드 ← / →', '왼쪽 · 오른쪽 옆걸음 (132 / 133, RT면 빠르게)', 'Q / E'],
  ['D패드 대각선', '대각선 걷기 (136~139)', 'W·S + A·D'],
  ['A', '펀치 (181)', 'J'], ['B', '오른팔 옆 공격 (130)', 'K'], ['X', '왼팔 옆 공격 (131)', 'U'],
  ['RB / LB', '오른발 킥 (121) / 왼발 킥 (120)', 'O / L'],
  ['오른쪽 스틱 ← / →', '왼팔 훅 (183) / 오른팔 훅 (182)', 'N / M'],
  ['왼쪽 스틱 ← / →', '왼쪽 막기 (122) / 오른쪽 막기 (123)', 'B / ,'],
  ['Y', '일어서기 (앞으로 넘어지면 105, 뒤로 넘어지면 106)', 'I'],
  ['View', '카메라 전환', 'C'], ['Menu', '일시정지', 'P'],
];
const keyTable = `<table class="k">${KEYS.map(([a, b, k]) => `<tr><td>${a}</td><td>${b} <span style="color:#8d93b5">[${k}]</span></td></tr>`).join('')}</table>`;
$('#help').innerHTML = `<b>🎮 엑스박스 컨트롤러 ↔ MAX-E1 모션</b> [키보드]${keyTable}
  <p style="color:#c9cde6;margin:8px 0 0">규정: 3분 · 다운 1점(킥으로 넘어뜨리면 경기당 한 번 크리티컬 2점) · 링아웃·5초 정지 1점 · 5다운 TKO · 다운 뒤 10카운트 안에 못 일어서면 KO · 동점이면 1분 골든 다운(대진표)</p>
  <label style="display:flex;gap:6px;margin-top:8px;align-items:center"><input type="checkbox" id="autoUp" ${SET.autoUp ? 'checked' : ''}> 넘어지면 자동으로 일어서기 (CM-550 예제 태스크처럼 1.2초 뒤) — 끄면 Y로 직접</label>
  <p style="color:#8d93b5;margin:6px 0 0">모션 데이터: ROBOTIS ENGINEER Kit 1 MAX-E1 예제 모션 © ROBOTIS · 몸체 치수·관절 방향: Dynamic-Makers</p>`;
$('#helpBtn').addEventListener('click', () => $('#help').classList.toggle('on'));
$('#autoUp').addEventListener('change', e => { SET.autoUp = e.target.checked; try { localStorage.setItem('wrlsim.hb.autoUp', SET.autoUp ? '1' : '0'); } catch (_) {} });
$('#card').innerHTML = `<h1>${esc(P.get('title') || '휴머노이드 배틀 — 연습')}</h1>
  <p>ROBOTIS MAX-E1을 엑스박스 컨트롤러로 조종합니다. 버튼마다 공식 예제 모션(걷기·옆걸음·펀치·훅·킥·막기·일어서기)이 연결되어 있습니다.${P.get('opp') ? ` 상대 팀 <b style="color:#ffd25a">${esc(P.get('opp'))}</b>` : ''} · 상대 실력 ${1 + Math.round(LEVEL * 4)}단계 / 5</p>
  <div class="cols"><div>${keyTable}</div><div>
    <p class="note">경기장: 밴텀급(1.5 kg 미만, MAX-E1 1.2 kg) 120 × 120 cm, 높이 10 cm · 가운데 "11" 선 뒤에서 마주 보고 출발</p>
    <p class="note">상대를 넘어뜨리면(다운) 1점, 경기장 밖으로 밀어내면(링아웃) 1점. 킥으로 넘어뜨리면 경기당 한 번 크리티컬 어택 2점. 3분 뒤 점수가 많은 쪽이 이기고, 5점을 먼저 얻으면 TKO 승리.</p>
    <p class="note">내가 넘어지면 팔로 짚고 일어서는 모션(앞 105 · 뒤 106)이 나옵니다 — 자동(1.2초 뒤) 또는 <b>Y</b>로 바로. 10카운트 안에 못 일어서면 KO 패배입니다. 공격 중(특히 킥)에는 균형이 무너져 잘 넘어집니다.</p>
    <p class="note">${MODE === 'match' ? '대진표 경기: 동점이면 1분 연장 — 먼저 점수를 내면 승리' : '연습 경기: 동점이면 무승부'}</p>
  </div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="startBtn">경기 시작</button></div>`;
$('#startBtn').addEventListener('click', () => { $('#overlay').style.display = 'none'; beep(1200, 0.05, 0.02); startMatch(); view.focus(); });
function showEnd(res, sc) {
  const ov = $('#overlay'); ov.style.display = 'flex';
  $('#card').innerHTML = `<h1>${res === 'win' ? '승리!' : res === 'loss' ? '패배' : '무승부'} — ${sc[0]} : ${sc[1]}</h1><p>${esc(G.why)}</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="again">다시 하기</button></div>`;
  $('#again').addEventListener('click', () => { ov.style.display = 'none'; startMatch(); view.focus(); });
}
$('#exit').addEventListener('click', () => post({ type: 'wrlsim:exit' })); if (!EMBED) $('#exit').style.display = 'none';
renderer.domElement.addEventListener('pointerdown', () => view.focus());
$('#cam').textContent = '📷 ' + CAMNAME[camMode] + ' (C · View)';
resize(); requestAnimationFrame(frame);
window.__hb = { me, op, G, AI, tick, startMatch, ATK, hitCheck, control, aiThink, Bot, camera, controls, setCam: m => { camMode = m; controls.enabled = m === 'free'; } };
post({ type: 'wrlsim:ready' });
</script>
</body>
</html>

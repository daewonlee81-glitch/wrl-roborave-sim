#view{position:absolute;inset:0;outline:none}

table.k{width:100%;border-collapse:collapse}
table.k td{border-bottom:1px solid #ffffff12;padding:4px 3px;vertical-align:top}

#overlay{position:absolute;inset:0;background:#0b0f14d0;display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.card{background:#2b3150;border:1px solid var(--line);border-radius:14px;padding:20px 24px;max-width:700px;box-shadow:0 20px 60px #000a}

.card .note{color:var(--mute);font-size:12px}
.card .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   휴머노이드 배틀 — ROBOTIS MAX-E1 (Dynamic-Makers와 같은 몸체 치수 · 관절 방향 · 공식 예제 모션)
   · 몸체: STEP 부품 조립 기준 치수(maxe1-cad.json), 6 × 2XL430 = 12축, 다리는 이중 평행 링크
   · 모션: ROBOTIS ENGINEER Kit 1 MAX-E1 예제 모션 파일(03_ENG1_MAX_E1.mtn3), © ROBOTIS
   · 판정: 모션 재생 + 간이 판정 (손·발 끝이 상대 몸에 닿으면 타격 → 힘·자세에 따라 다운)
   · 규정: worldrobotleague.net/rules/humanoid-battle — 밴텀급(1.5 kg 미만) 경기장 120 × 120 cm
   ============================================================ */
const P = new URLSearchParams(location.search);
const EMBED = P.get('embed') === '1', MODE = P.get('mode') || 'practice';
const LEVEL = Math.max(0, Math.min(1, +(P.get('level') || 0.3)));
const post = m => { if (EMBED) try { parent.postMessage(Object.assign({ source: 'wrlsim' }, m), '*'); } catch (e) {} };
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const D2R = Math.PI / 180;

const RULE = { arena: 1.20, platH: 0.10, time: 180, ot: 60, tko: 5, count: 10, idle: 5, startGap: 0.30 };

/* ---------------- 모션 ---------------- */
const MOT = await fetch('maxe1-motions.json').then(r => r.json());
const FRAME = MOT.frameSeconds;
const CALL = Object.fromEntries(MOT.calls);
function timeline(idx, start, speed = 1) {
  const flow = MOT.flows[CALL[idx]]; if (!flow) return null;
  const frames = [{ t: 0, pose: start.slice() }]; let t0 = 0;
  for (const [page, loop, sp0] of flow) {
    const rows = MOT.pages[page]; if (!rows) continue; const sp = Math.max(0.05, sp0 * speed), secs = rows[rows.length - 1][0] * FRAME;
    for (let k = 0; k < loop; k++) { for (const r of rows) frames.push({ t: t0 + r[0] * FRAME / sp, pose: r.slice(1) }); t0 += secs / sp; }
  }
  return { frames, dur: t0 };
}
function poseAt(tl, t) {
  const f = tl.frames; if (t <= 0) return f[0].pose;
  for (let i = 1; i < f.length; i++) if (f[i].t >= t) { const a = f[i - 1], b = f[i], k = (t - a.t) / Math.max(1e-6, b.t - a.t); return b.pose.map((v, n) => a.pose[n] + (v - a.pose[n]) * k); }
  return f[f.length - 1].pose;
}
// 모션별 이동(이 시뮬레이터의 가정): 앞 m/s · 왼쪽 m/s · 회전 rad/s
const MOVE = {
  150: [0.05, 0, 0], 152: [0.11, 0, 0], 154: [0.04, 0, 0], 151: [0.1, 0, 0.25], 153: [0.1, 0, -0.25],
  155: [-0.04, 0, 0], 157: [-0.09, 0, 0], 159: [-0.03, 0, 0],
  160: [0.08, 0, 0], 162: [0.19, 0, 0], 164: [0.07, 0, 0], 165: [-0.07, 0, 0], 167: [-0.15, 0, 0], 169: [-0.05, 0, 0],
  132: [0, 0.055, 0], 133: [0, -0.055, 0], 134: [0, -0.07, 0], 135: [0, 0.07, 0],
  136: [0.045, -0.045, 0], 137: [0.045, 0.045, 0], 138: [-0.04, -0.04, 0], 139: [-0.04, 0.04, 0],
  140: [0, 0, -0.75], 141: [0, 0, 0.75],
};
// 공격: 쓰는 손발, 타격 구간(모션 진행 비율), 힘
const ATK = {
  181: { name: '펀치', limb: 'Lh', win: [0.2, 0.62], pow: 1.0 },
  130: { name: '오른팔 옆 공격', limb: 'Rh', win: [0.32, 0.72], pow: 1.35 },
  131: { name: '왼팔 옆 공격', limb: 'Lh', win: [0.32, 0.72], pow: 1.35 },
  182: { name: '오른팔 훅', limb: 'Rh', win: [0.3, 0.68], pow: 1.55 },
  183: { name: '왼팔 훅', limb: 'Lh', win: [0.3, 0.68], pow: 1.55 },
  121: { name: '오른발 킥', limb: 'Rf', win: [0.35, 0.72], pow: 2.1, kick: true },
  120: { name: '왼발 킥', limb: 'Lf', win: [0.35, 0.72], pow: 2.1, kick: true },
};
const BLOCK = { 122: [0.15, 0.85], 123: [0.15, 0.85] };

/* ---------------- 장면 ---------------- */
const view = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2c3150); scene.fog = new THREE.Fog(0x2c3150, 4, 10);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 30);
const controls = new OrbitControls(camera, renderer.domElement); controls.enabled = false; controls.target.set(0, RULE.platH + 0.15, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404a66, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(0.8, 2.6, 1.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.5, far: 6 }); scene.add(sun);
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
// 경기장: 120 × 120 cm, 높이 10 cm, PET 바닥 · 가운데 "11" 출발선
{
  const A = RULE.arena, c = document.createElement('canvas'); c.width = c.height = 1200; const g = c.getContext('2d');
  g.fillStyle = '#eef0f2'; g.fillRect(0, 0, 1200, 1200);
  g.strokeStyle = '#00000010'; for (let i = 0; i <= 1200; i += 100) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 1200); g.moveTo(0, i); g.lineTo(1200, i); g.stroke(); }
  g.fillStyle = '#1b1b1f'; for (const x of [600 - 150 - 12, 600 - 150 + 4, 600 + 150 - 16, 600 + 150]) g.fillRect(x, 520, 12, 160);
  g.strokeStyle = '#c03a2b'; g.lineWidth = 16; g.strokeRect(8, 8, 1184, 1184);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const top = new THREE.Mesh(new THREE.BoxGeometry(A, RULE.platH, A), [0, 1, 2, 3, 4, 5].map(i => i === 2 ? new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 }) : new THREE.MeshStandardMaterial({ color: 0x8b6b45, roughness: 0.8 })));
  top.position.y = RULE.platH / 2; top.receiveShadow = true; top.castShadow = true; scene.add(top);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x3a3f5c, roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
}

/* ---------------- MAX-E1 3D 모델 ---------------- */
// MuJoCo 좌표(x 앞, y 왼쪽, z 위) → three(x 앞, y 위, z 오른쪽): (x, z, −y)
const JOINTS = [ // ID 1~12 (Dynamic-Makers MAXE1_JOINT_MAP과 같은 방향)
  ['R_shoulder_pitch', -1], ['R_shoulder_roll', -1], ['L_shoulder_pitch', 1], ['L_shoulder_roll', 1],
  ['R_hip_roll', -1], ['R_hip_pitch', 1], ['L_hip_roll', -1], ['L_hip_pitch', 1],
  ['R_knee', -1], ['R_ankle_roll', 1], ['L_knee', -1], ['L_ankle_roll', 1]];
const TILT = 15 * D2R, ARM_L = 0.1415, ZC = 0.3072;
function buildRobot(teamColor, frameColor) {
  const mk = (geo, color, rough = 0.55) => { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: rough })); m.castShadow = true; m.receiveShadow = true; return m; };
  const box = (x, y, z, color, px = 0, py = 0, pz = 0, parent) => { const m = mk(new THREE.BoxGeometry(x, y, z), color); m.position.set(px, py, pz); parent.add(m); return m; };
  const link = (len, r, color, parent) => { const m = mk(new THREE.CylinderGeometry(r, r, len, 12), color); m.position.y = -len / 2; parent.add(m); return m; };
  const DARK = 0x26272b, FRAME = frameColor;
  const root = new THREE.Group();     // 경기장 위치 · 방향
  const tilt = new THREE.Group(); root.add(tilt); // 넘어짐 (발 쪽을 축으로)
  const body = new THREE.Group(); tilt.add(body);  // 바닥에서 몸통까지 높이 보정
  const torso = new THREE.Group(); torso.position.y = ZC; body.add(torso);
  box(0.0504, 0.0506, 0.1077, teamColor, 0, 0, 0, torso);
  box(0.044, 0.044, 0.094, FRAME, 0, -0.0436, 0, torso);
  box(0.0326, 0.048, 0.09, DARK, -0.0433, -0.082, 0, torso);
  const head = box(0.042, 0.046, 0.034, 0xf1f2f6, 0, 0.0253 + 0.023, 0, torso);
  box(0.006, 0.012, 0.024, 0x111111, 0.021, 0.006, 0, head);
  const J = {}, M = {};
  for (const [side, out] of [['R', 1], ['L', -1]]) {    // three z: 오른쪽 +
    const sh = new THREE.Group(); sh.position.set(0, 0.32594 - ZC, out * 0.07058); torso.add(sh);
    box(0.041, 0.047, 0.041, DARK, 0, 0, 0, sh);
    const shP = new THREE.Group(); sh.add(shP); J[side + '_shoulder_pitch'] = { o: shP, axis: new THREE.Vector3(0, out * Math.sin(TILT), -Math.cos(TILT)).normalize() };
    const arm = new THREE.Group(); arm.position.set(0, 0.30275 - 0.32594, out * (0.0768 - 0.07058)); shP.add(arm);
    const armR = new THREE.Group(); arm.add(armR); J[side + '_shoulder_roll'] = { o: armR, axis: new THREE.Vector3(1, 0, 0) };
    const dir = new THREE.Vector3(0, -Math.cos(TILT), out * Math.sin(TILT));
    const lk = mk(new THREE.CylinderGeometry(0.013, 0.011, ARM_L, 12), FRAME); lk.position.copy(dir.clone().multiplyScalar(ARM_L / 2)); lk.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); armR.add(lk);
    const hand = mk(new THREE.SphereGeometry(0.016, 12, 10), teamColor); hand.position.copy(dir.clone().multiplyScalar(ARM_L)); armR.add(hand); M[side + 'h'] = hand;
    // 다리 (이중 평행 링크)
    const hip = new THREE.Group(); hip.position.set(0, 0.2172 - ZC, out * 0.0352); torso.add(hip);
    const hipR = new THREE.Group(); hip.add(hipR); J[side + '_hip_roll'] = { o: hipR, axis: new THREE.Vector3(1, 0, 0) };
    box(0.041, 0.047, 0.041, DARK, 0, -0.012, 0, hipR);
    const thigh = new THREE.Group(); thigh.position.y = 0.1932 - 0.2172; hipR.add(thigh); J[side + '_hip_pitch'] = { o: thigh, axis: new THREE.Vector3(0, 0, -1) };
    link(0.06, 0.011, FRAME, thigh);
    const kf = new THREE.Group(); kf.position.y = -0.06; thigh.add(kf); J[side + '_knee_comp'] = { o: kf, axis: new THREE.Vector3(0, 0, -1) };
    box(0.032, 0.032, 0.036, FRAME, 0.012, -0.008, 0, kf);
    const shin = new THREE.Group(); shin.position.y = 0.1177 - 0.1332; kf.add(shin); J[side + '_knee'] = { o: shin, axis: new THREE.Vector3(0, 0, -1) };
    link(0.06, 0.011, FRAME, shin);
    const af = new THREE.Group(); af.position.y = -0.06; shin.add(af); J[side + '_ankle_comp'] = { o: af, axis: new THREE.Vector3(0, 0, -1) };
    box(0.041, 0.047, 0.041, DARK, 0, -0.012, 0, af);
    const foot = new THREE.Group(); foot.position.y = 0.0337 - 0.0577; af.add(foot); J[side + '_ankle_roll'] = { o: foot, axis: new THREE.Vector3(1, 0, 0) };
    box(0.102, 0.0082, 0.064, teamColor, 0, -0.0337 + 0.0041, 0, foot);
    const toe = new THREE.Object3D(); toe.position.set(0.05, -0.028, 0); foot.add(toe); M[side + 'f'] = toe;
    const sole = new THREE.Object3D(); sole.position.set(0, -0.0337, 0); foot.add(sole); M[side + 's'] = sole;
  }
  return { root, tilt, body, torso, head, J, M };
}

/* ---------------- 로봇 ---------------- */
class Bot {
  constructor(team) {
    this.team = team; this.name = team ? '상대' : '나';
    this.m = buildRobot(team ? 0xd23a2a : 0x2f6bff, 0x9aa3b0); scene.add(this.m.root);
    this.reset(team ? RULE.startGap / 2 : -RULE.startGap / 2, 0, team ? Math.PI : 0);
  }
  reset(x, z, th) {
    Object.assign(this, { x, z, th, pose: Array(12).fill(0), mot: null, queue: [], walk: null, fallen: null, fallT: 0, pitch: 0, out: false, kb: [0, 0, 0], hitDone: false, idleT: 0, critUsed: this.critUsed || false, getup: false });
    this.play(101);
  }
  play(idx, opts = {}) {
    const tl = timeline(idx, this.pose, opts.speed || 1); if (!tl) return false;
    this.mot = { idx, tl, t: 0, kind: opts.kind || (ATK[idx] ? 'atk' : BLOCK[idx] ? 'block' : MOVE[idx] ? 'move' : 'pose'), then: opts.then || null };
    this.hitDone = false; if (idx !== 101) this.idleT = 0; return true;
  }
  get busy() { return this.mot && (this.mot.kind === 'atk' || this.mot.kind === 'block' || this.mot.kind === 'getup'); }
  get progress() { return this.mot ? this.mot.t / Math.max(1e-6, this.mot.tl.dur) : 1; }
  fwd() { return [Math.cos(this.th), -Math.sin(this.th)]; }
  left() { return [-Math.sin(this.th), -Math.cos(this.th)]; }
  step(dt) {
    // 넉백
    if (this.kb[2] > 0) { const k = Math.min(dt, this.kb[2]); this.x += this.kb[0] * k; this.z += this.kb[1] * k; this.kb[2] -= dt; }
    if (this.fallen && !this.getup) { this.fallT += dt; this.pitch = Math.min(1, this.pitch + dt * 3.2); return; }
    const m = this.mot; if (!m) return;
    m.t += dt;
    this.pose = poseAt(m.tl, m.t);
    const mv = MOVE[m.idx]; if (mv && !this.fallen) {
      const f = this.fwd(), l = this.left();
      this.x += (f[0] * mv[0] + l[0] * mv[1]) * dt; this.z += (f[1] * mv[0] + l[1] * mv[1]) * dt; this.th = wrapA(this.th + mv[2] * dt);
    }
    if (this.getup) this.pitch = Math.max(0, 1 - this.progress / 0.7);
    if (m.t >= m.tl.dur) {
      const was = m; this.mot = null;
      if (this.getup) { this.getup = false; this.fallen = null; this.pitch = 0; }
      if (was.then) was.then();
      else if (!this.mot && was.idx !== 101 && !MOVE[was.idx]) this.play(101);
    }
  }
  // 걷기: 시작 → 반복(누르는 동안) → 끝
  walkCtl(dir, fast) {
    if (this.busy || this.fallen) return;
    const S = dir > 0 ? (fast ? [160, 162, 164] : [150, 152, 154]) : (fast ? [165, 167, 169] : [155, 157, 159]);

  $('#side').innerHTML = `<div class="row"><span>내 로봇 (파랑)</span><b>${st(me)}</b></div><div class="row"><span>상대 (빨강) · ${1 + Math.round(LEVEL * 4)}단계</span><b>${st(op)}</b></div>
    <div class="row"><span>거리</span><b>${(dist(me, op) * 100).toFixed(0)} cm</b></div>
    <div class="row"><span>크리티컬 어택</span><b>${me.critUsed ? '사용함' : '남음 (킥 다운 2점)'}</b></div>
    <div class="msg">${me.fallen && !me.getup ? '⚠ 다운! Y 버튼(I 키)으로 일어서세요' : me.idleT > 3 ? '⚠ 5초 넘게 멈추면 스탠딩 다운' : ''}</div>`;
  $('#pad').classList.toggle('on', IN.pad); $('#padTxt').textContent = IN.pad ? '🎮 엑스박스 컨트롤러 연결됨' : '컨트롤러 없음 — 키보드 사용 (버튼을 한 번 누르면 연결)';
}

/* ---------------- 시작 카드 · 도움말 ---------------- */
const KEYS = [
  ['D패드 ↑ / ↓', '앞으로 · 뒤로 걷기 (150·152·154 / 155·157·159)', 'W / S'],
  ['RT + D패드 ↑ / ↓', '빠르게 걷기 (160~169)', 'Shift'],
  ['D패드 ← / →', '제자리 왼쪽 · 오른쪽 돌기 (141 / 140)', 'A / D'],
  ['LT + D패드 ← / →', '왼쪽 · 오른쪽 옆걸음 (132 / 133, RT면 빠르게)', 'Q / E'],
  ['D패드 대각선', '대각선 걷기 (136~139)', 'W·S + A·D'],
  ['A', '펀치 (181)', 'J'], ['B', '오른팔 옆 공격 (130)', 'K'], ['X', '왼팔 옆 공격 (131)', 'U'],
  ['RB / LB', '오른발 킥 (121) / 왼발 킥 (120)', 'O / L'],
  ['오른쪽 스틱 ← / →', '왼팔 훅 (183) / 오른팔 훅 (182)', 'N / M'],
  ['왼쪽 스틱 ← / →', '왼쪽 막기 (122) / 오른쪽 막기 (123)', 'B / ,'],
  ['Y', '일어서기 (앞으로 넘어지면 105, 뒤로 넘어지면 106)', 'I'],
  ['View', '카메라 전환', 'C'], ['Menu', '일시정지', 'P'],
];
const keyTable = `<table class="k">${KEYS.map(([a, b, k]) => `<tr><td>${a}</td><td>${b} <span style="color:#8d93b5">[${k}]</span></td></tr>`).join('')}</table>`;
$('#help').innerHTML = `<b>🎮 엑스박스 컨트롤러 ↔ MAX-E1 모션</b> [키보드]${keyTable}
  <p style="color:#c9cde6;margin:8px 0 0">규정: 3분 · 다운 1점(킥으로 넘어뜨리면 경기당 한 번 크리티컬 2점) · 링아웃·5초 정지 1점 · 5다운 TKO · 다운 뒤 10카운트 안에 못 일어서면 KO · 동점이면 1분 골든 다운(대진표)</p>
  <p style="color:#8d93b5;margin:6px 0 0">모션 데이터: ROBOTIS ENGINEER Kit 1 MAX-E1 예제 모션 © ROBOTIS · 몸체 치수·관절 방향: Dynamic-Makers</p>`;
$('#helpBtn').addEventListener('click', () => $('#help').classList.toggle('on'));
$('#card').innerHTML = `<h1>${esc(P.get('title') || '휴머노이드 배틀 — 연습')}</h1>
  <p>ROBOTIS MAX-E1을 엑스박스 컨트롤러로 조종합니다. 버튼마다 공식 예제 모션(걷기·옆걸음·펀치·훅·킥·막기·일어서기)이 연결되어 있습니다.${P.get('opp') ? ` 상대 팀 <b style="color:#ffd25a">${esc(P.get('opp'))}</b>` : ''} · 상대 실력 ${1 + Math.round(LEVEL * 4)}단계 / 5</p>
  <div class="cols"><div>${keyTable}</div><div>
    <p class="note">경기장: 밴텀급(1.5 kg 미만, MAX-E1 1.2 kg) 120 × 120 cm, 높이 10 cm · 가운데 "11" 선 뒤에서 마주 보고 출발</p>
    <p class="note">상대를 넘어뜨리면(다운) 1점, 경기장 밖으로 밀어내면(링아웃) 1점. 킥으로 넘어뜨리면 경기당 한 번 크리티컬 어택 2점. 3분 뒤 점수가 많은 쪽이 이기고, 5점을 먼저 얻으면 TKO 승리.</p>
    <p class="note">내가 넘어지면 <b>Y</b>로 일어서세요. 10카운트 안에 못 일어서면 KO 패배입니다. 공격 중(특히 킥)에는 균형이 무너져 잘 넘어집니다.</p>
    <p class="note">${MODE === 'match' ? '대진표 경기: 동점이면 1분 연장 — 먼저 점수를 내면 승리' : '연습 경기: 동점이면 무승부'}</p>
  </div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="startBtn">경기 시작</button></div>`;
$('#startBtn').addEventListener('click', () => { $('#overlay').style.display = 'none'; beep(1200, 0.05, 0.02); startMatch(); view.focus(); });
function showEnd(res, sc) {
  const ov = $('#overlay'); ov.style.display = 'flex';
  $('#card').innerHTML = `<h1>${res === 'win' ? '승리!' : res === 'loss' ? '패배' : '무승부'} — ${sc[0]} : ${sc[1]}</h1><p>${esc(G.why)}</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="again">다시 하기</button></div>`;
  $('#again').addEventListener('click', () => { ov.style.display = 'none'; startMatch(); view.focus(); });
}
$('#exit').addEventListener('click', () => post({ type: 'wrlsim:exit' })); if (!EMBED) $('#exit').style.display = 'none';
renderer.domElement.addEventListener('pointerdown', () => view.focus());
cycleCam(); cycleCam(); cycleCam(); cycleCam(); // 'side'로
resize(); requestAnimationFrame(frame);
window.__hb = { me, op, G, AI, tick, startMatch, ATK, hitCheck, control, aiThink, Bot };
post({ type: 'wrlsim:ready' });
</script>

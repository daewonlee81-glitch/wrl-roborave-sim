<style>
:root{--bg:#1d2238;--panel:#262c47ee;--line:#454d74;--text:#eef0f8;--mute:#a7abc6;--gold:#ffd25a;--ok:#3fb950;--red:#e5483b;--blue:#2f6bff}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#view{position:absolute;inset:0;outline:none}
#view canvas{display:block;width:100%;height:100%}
.btn{background:#3a4166;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{background:#474f7a}
.btn.pri{background:linear-gradient(90deg,#ffd25a,#ff8f5a);color:#2a1d05;border-color:transparent}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;filter:drop-shadow(0 2px 8px #0008);pointer-events:none}

#hud .a{background:var(--red);border-radius:10px 0 0 10px}#hud .b{background:var(--blue);border-radius:0 10px 10px 0}

#exit{position:absolute;left:10px;top:10px;z-index:6}
#side{position:absolute;left:10px;top:52px;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;pointer-events:none}

#side .row:first-child{border-top:0}
#side .msg{margin-top:6px;color:var(--gold)}
#side .bar{height:8px;border-radius:4px;background:#ffffff18;overflow:hidden;margin-top:3px}
#side .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd25a,#ff5a3c)}
#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,3vw,42px);font-weight:900;text-shadow:0 3px 12px #000;pointer-events:none;text-align:center;white-space:pre-line;opacity:0;transition:opacity .2s;max-width:92%}
#banner.show{opacity:1}
#pad{position:absolute;left:10px;bottom:10px;background:#0d1117e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}

#pad.on{border-color:var(--ok)} #pad.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}

#helpBtn{position:absolute;right:10px;top:10px;z-index:6}
#help{position:absolute;right:10px;top:52px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:none;max-height:calc(100% - 110px);overflow:auto}
#help.on{display:block}
table.k{width:100%;border-collapse:collapse}
table.k td{border-bottom:1px solid #ffffff12;padding:4px 3px;vertical-align:top}
table.k td:first-child{color:var(--mute);white-space:nowrap;width:42%}
#overlay{position:absolute;inset:0;background:#0b0f14d0;display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.card{background:#2b3150;border:1px solid var(--line);border-radius:14px;padding:20px 24px;max-width:720px;box-shadow:0 20px 60px #000a}
.card h1{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0;color:#d6d9ec}
.card .note{color:var(--mute);font-size:12px}
.card .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>

import * as THREE from 'three';

/* ============================================================

  time: 120, extra: 60,

/* ---------------- 장면 ---------------- */
const view = $('#view');

new ResizeObserver(resize).observe(view);
{ // 경기장 매트 (1 m = 1000 px)
  const c = document.createElement('canvas'); c.width = 3000; c.height = 1000; const g = c.getContext('2d');

  g.fillStyle = '#d3d6dc'; g.fillRect(X(-0.70), Z(-0.47), 1400, 940);
  g.fillStyle = '#d3dcf6'; g.fillRect(X(0.73), Z(-0.47), 740, 940);
  for (const s of [-1, 1]) { // 출발 구역 · 블록 줄
    const x0 = s < 0 ? -1.47 : 1.27; g.strokeStyle = s < 0 ? '#c0392b' : '#2a5fe0'; g.lineWidth = 6; g.strokeRect(X(x0), Z(-0.15), 200, 300);
    g.fillStyle = '#ffffff99'; g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.fillText('START', X(x0 + 0.1), Z(0) + 12);
    g.strokeStyle = '#00000040'; g.lineWidth = 3; for (let i = 0; i < 10; i++) g.strokeRect(X(s * C.rowX - 0.02), Z(-0.2 + i * 0.04), 40, 40);
  }

  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(C.L, C.W), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }));
  mat.rotation.x = -Math.PI / 2; mat.position.y = 0.0005; mat.receiveShadow = true; scene.add(mat);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0xc9ced8, roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
}

/* ---------------- 물리 ---------------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
world.broadphase = new CANNON.SAPBroadphase(world); world.allowSleep = true; world.solver.iterations = 20;

world.addContactMaterial(new CANNON.ContactMaterial(mBlock, mBlock, { friction: 0.25, restitution: 0.45 }));
world.addContactMaterial(new CANNON.ContactMaterial(mBot, mBlock, { friction: 0.15, restitution: 0.15 }));

/* 블록: 40 mm 정육면체, 위아래 모서리 모따기 */

const blockGeo = (() => { const s = C.block.s, c = 0.006, h = s / 2; const shp = new THREE.Shape(); shp.moveTo(-h, -h); shp.lineTo(h, -h); shp.lineTo(h, h); shp.lineTo(-h, h); shp.closePath();

function makeBlock(team, x, z) {
  const mesh = new THREE.Mesh(blockGeo, new THREE.MeshStandardMaterial({ color: TEAMC[team], roughness: 0.5 })); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);

function slideFriction(dt) { // 쿨롱 마찰: 바닥에 닿은 블록의 수평 속도를 μg만큼 줄임 → 미끄러지는 거리 = v² / (2μg)

/* ---------------- 드라이브 로봇 ---------------- */
const DR = { L: 0.18, W: 0.16, H: 0.09, vmax: 0.6, wmax: 4.0, pocket: 0.06, grip: 0.10, vStrikeMin: 0.35, vStrikeMax: 3.0 };

  const g = new THREE.Group(), col = TEAMC[team];
  const m = (geo, c) => { const o = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.55 })); o.castShadow = true; o.receiveShadow = true; return o; };
  const body = m(new THREE.BoxGeometry(DR.L, 0.05, DR.W), 0x2b2e35); body.position.y = 0.045; g.add(body);
  const top = m(new THREE.BoxGeometry(DR.L * 0.8, 0.03, DR.W * 0.85), col); top.position.set(-0.01, 0.085, 0); g.add(top);
  for (const [x, z] of [[0.05, DR.W / 2 + 0.01], [0.05, -DR.W / 2 - 0.01], [-0.05, DR.W / 2 + 0.01], [-0.05, -DR.W / 2 - 0.01]]) { const w = m(new THREE.CylinderGeometry(0.028, 0.028, 0.018, 18), 0x15161a); w.rotation.x = Math.PI / 2; w.position.set(x, 0.028, z); g.add(w); }

    this.body.addShape(new CANNON.Box(new CANNON.Vec3(DR.L / 2, 0.035, DR.W / 2 + 0.02)), new CANNON.Vec3(0, 0.04, 0));

    else if ((mi === 132 || mi === 133) && Math.abs(lz - KICK.lz) < 0.01) cut();
    else if (mi >= 150 && mi <= 154 && lx <= KICK.lx + 0.015) cut();
    else if (mi >= 155 && mi <= 159 && lx >= KICK.lx - 0.005) cut();
    if (b.walk || (b.mot && b.mot.idx !== 101)) { /* 동작 중 */ }
    else if (turnTo(aimTh, 0.03)) { // 블록을 로컬 좌표로 보고 앞뒤 · 옆 맞추기
      if (lz - KICK.lz > 0.022) { IN.lt = 1; IN.rg = 1; } else if (lz - KICK.lz < -0.022) { IN.lt = 1; IN.lf = 1; }
      else if (lx > KICK.lx + 0.022) IN.up = 1; else if (lx < KICK.lx - 0.022) IN.dn = 1;
      else { // 거리만큼 힘: v = √(2μgd) × (1 ± 오차)
        const v = Math.sqrt(2 * C.mu * 9.81 * (dl + AI.tgt.extra)) * (1 + (Math.random() * 2 - 1) * AIP.pow) * (AI.tgt.take ? 1.25 : 1);
        AI.want = clamp((v - KICK.vMin) / (KICK.vMax - KICK.vMin), 0, 1); IN.rb = 1; bl.played = true; AI.st = 'pick'; AI.wait = AIP.pause + 0.8;
      }
    }
    if (AI.t > 15) { bl.played = true; AI.st = 'pick'; } // 못 맞추면 다른 블록으로
  }
  controlHumanoid(h, IN);
}

/* ---------------- 경기 ---------------- */
const robots = DIV === 'drive' ? [new Drive(0), new Drive(1)] : [new Humanoid(0), new Humanoid(1)];
const me = robots[0], op = robots[1];
const G = { phase: 'idle', clock: C.time, t: 0, paused: false, called: -1, result: null, dq: -1, endT: 0, why: '' };
let AC = null; function beep(f = 900, d = 0.08, v = 0.05, type = 'square') { try { AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch (e) {} }
function banner(t, d = 1.6) { const el = $('#banner'); el.textContent = t; el.classList.add('show'); clearTimeout(banner.t); banner.t = setTimeout(() => el.classList.remove('show'), d * 1000); }
function setup() {
  clearBlocks();
  for (const team of [0, 1]) { const s = team ? 1 : -1; for (let i = 0; i < C.nBlocks; i++) makeBlock(team, s * C.rowX, -0.18 + i * 0.04); }
  for (const r of robots) r.reset();
  Object.assign(AI, { st: 'pick', blk: null, tgt: null, t: 0, wait: 1.2 - LEVEL * 0.6, aimErr: undefined });
  Object.assign(G, { phase: 'count', clock: C.time, t: 0, called: -1, result: null, dq: -1, endT: 0, why: '' });
  banner('3', 0.8); beep(600, 0.1);
}
function score() {
  const out = [{ g: 0, o: 0, y: 0, c: 0, pts: 0, left: 0 }, { g: 0, o: 0, y: 0, c: 0, pts: 0, left: 0 }];
  for (const b of BLOCKS) {
    const S = out[b.team];
    if (!b.played && !b.out) S.left++;
    if (b.out || b.held || b.body.position.y > 0.03) continue;
    const d = Math.hypot(b.body.position.x, b.body.position.z) - C.block.contact / 2; // 선에 걸치면 높은 구역
    if (d <= 0.015) { S.c++; S.pts += 50; } else if (d <= 0.075) { S.g++; S.pts += 5; } else if (d <= 0.15) { S.o++; S.pts += 3; } else if (d <= 0.25) { S.y++; S.pts += 1; }
  }
  return out;
}
function decide(sc) {
  if (G.dq >= 0) return [1 - G.dq, `${TEAMN[G.dq]} 실격 — 회색 구역 진입`];
  if (G.called >= 0) return [G.called, '콜드게임 — 검정 중심에 닿음'];
  for (const [k, n] of [['g', '초록'], ['o', '주황'], ['y', '노랑']]) if (sc[0][k] !== sc[1][k]) return [sc[0][k] > sc[1][k] ? 0 : 1, `${n} 구역 블록 수 ${sc[0][k]} : ${sc[1][k]}`];
  return [-1, '하우스 블록 수가 같음'];
}
function finish(why) {
  if (G.phase === 'end' || G.phase === 'settle') return; G.phase = 'settle'; G.endT = 0; G.why = why;
  for (const r of robots) if (r.held) r.release(0);
  banner(why, 1.6);
}
function finalize() {
  G.phase = 'end'; const sc = score(), [w, why] = decide(sc); G.result = { w, why, sc };
  const res = w < 0 ? 'draw' : w === 0 ? 'win' : 'loss';
  banner((res === 'win' ? '승리!' : res === 'loss' ? '패배' : '무승부') + '\n' + why, 4);
  const detail = `로봇 컬링 · ${why} · 나 초록 ${sc[0].g}·주황 ${sc[0].o}·노랑 ${sc[0].y} / 상대 초록 ${sc[1].g}·주황 ${sc[1].o}·노랑 ${sc[1].y}`;
  setTimeout(() => { post({ type: 'wrlsim:result', result: res, score: [sc[0].pts, sc[1].pts], detail }); if (!EMBED) showEnd(res, sc, why); }, 2600);
}
function togglePause() { if (G.phase === 'play' || G.phase === 'count') { G.paused = !G.paused; banner(G.paused ? '일시정지' : '재개', 0.8); } }

const DT = 1 / 240; let acc = 0;
function tick(dt, IN) {
  G.t += dt;
  if (G.phase === 'count') { if (G.t >= 3) { G.phase = 'play'; banner('시작!', 0.9); beep(880, 0.3, 0.06, 'sine'); } else if (Math.floor(G.t - dt) !== Math.floor(G.t)) { banner(String(3 - Math.floor(G.t)), 0.8); beep(600, 0.1); } }
  const live = G.phase === 'play';
  if (live) {
    if (DIV === 'drive') { controlDrive(me, IN, dt); aiDrive(op, dt); } else { controlHumanoid(me, IN); aiHumanoid(op, dt); }
  } else if (DIV === 'drive') { for (const r of robots) r.drive(0, 0, dt); }
  for (const r of robots) r.step(dt);
  acc += dt; let n = 0; while (acc >= DT && n < 30) { world.step(DT); slideFriction(DT); acc -= DT; n++; } if (n >= 30) acc = 0;
  for (const b of BLOCKS) {
    const p = b.body.position;
    if (!b.out && (Math.abs(p.x) > C.L / 2 || Math.abs(p.z) > C.W / 2 || p.y < -0.05)) { b.out = true; b.played = true; b.mesh.visible = false; world.removeBody(b.body); }
    if (!b.played && Math.abs(p.x) < C.zoneLine) b.played = true;
    if (live && !b.held && p.y > 0.05 && b.body.velocity.y > 0.2) banner('⚠ 블록을 던지면 안 됩니다', 1.2);
  }
  if (live) {
    G.clock -= dt; if (G.clock <= 0) { G.clock = 0; finish('2분 종료'); }
    // 실격: 드라이브는 바퀴 4개 모두, 휴머노이드는 두 발 모두 회색 구역 안
    for (const r of robots) if (r.allInGrey()) { G.dq = r.team; finish(`${TEAMN[r.team]} — 회색 구역에 ${DIV === 'drive' ? '바퀴가 모두' : '두 발이 모두'} 들어감 (실격)`); }
    // 콜드게임: 검정 중심에 닿은 채 멈춘 블록 (미끄러져 지나가는 건 제외)
    for (const b of BLOCKS) if (!b.out && !b.held && b.body.position.y < 0.03 && b.body.velocity.length() < 0.02 && Math.hypot(b.body.position.x, b.body.position.z) <= 0.015 + C.block.contact / 2) { G.called = b.team; finish(`콜드게임! ${TEAMN[b.team]} 블록이 검정 중심에`); break; }
    // 두 팀 모두 블록을 다 쓰고 모두 멈추면 끝
    const sc = score(); if (G.phase === 'play' && sc[0].left === 0 && sc[1].left === 0 && !robots.some(r => r.held) && BLOCKS.every(b => b.out || b.body.velocity.length() < 0.01)) finish('두 팀 모두 블록을 다 씀');
  }
  if (G.phase === 'settle') { G.endT += dt; if (G.endT > 1.5 && BLOCKS.every(b => b.out || b.body.velocity.length() < 0.01) || G.endT > 4) finalize(); }
}

/* ---------------- 카메라 ---------------- */
const CAMS = ['oblique', 'end', 'top', 'follow', 'free'], CAMNAME = { oblique: '비스듬히', end: '내 진영 뒤', top: '탑뷰', follow: '내 로봇 추적', free: '자유 (마우스)' };
let camMode = 'oblique', camSnap = true; const camP = new THREE.Vector3(), camT = new THREE.Vector3();
function cycleCam() { camMode = CAMS[(CAMS.indexOf(camMode) + 1) % CAMS.length]; controls.enabled = camMode === 'free'; if (camMode === 'free') controls.target.set(0, 0, 0); camSnap = true; $('#cam').textContent = '📷 ' + CAMNAME[camMode] + ' (C · Y)'; }
function updateCam(dt) {
  if (camMode === 'free') { controls.update(); return; }
  const T = new THREE.Vector3(), Pp = new THREE.Vector3();
  if (camMode === 'oblique') { T.set(-0.25, 0, 0); Pp.set(-2.0, 1.45, 1.35); }
  else if (camMode === 'end') { T.set(0.1, 0, 0); Pp.set(-2.55, 0.95, 0); }
  else if (camMode === 'top') { T.set(0, 0, 0); Pp.set(0, 3.3, 0.25); }
  else { const f = me.fwd(); T.set(me.x + f[0] * 0.6, 0, me.z + f[1] * 0.6); Pp.set(me.x - f[0] * 0.55, 0.5, me.z - f[1] * 0.55); }
  const k = camSnap ? 1 : 1 - Math.exp(-dt * 4); camSnap = false; camP.lerp(Pp, k); camT.lerp(T, k); camera.position.copy(camP); camera.lookAt(camT);
}

/* ---------------- 화면 ---------------- */
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const IN = readInput();
  if (!G.paused && G.phase !== 'idle') tick(dt, IN);
  for (const b of BLOCKS) { b.mesh.position.copy(b.body.position); b.mesh.quaternion.copy(b.body.quaternion); }
  updateCam(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.1) { hudT = 0; hud(IN); }
  requestAnimationFrame(frame);
}
function hud(IN) {
  const sc = score();
  $('#sA').textContent = sc[0].pts; $('#sB').textContent = sc[1].pts;
  $('#clock').textContent = fmt(G.clock);
  $('#per').textContent = { idle: '대기', count: '준비', play: '경기 중', settle: '블록 멈추는 중', end: '경기 종료' }[G.phase] || '';
  const row = (l, v) => `<div class="row"><span>${l}</span><b>${v}</b></div>`;
  let h = row('남은 블록 (나 · 상대)', `${sc[0].left} · ${sc[1].left}`) + row('나: 초록·주황·노랑', `${sc[0].g} · ${sc[0].o} · ${sc[0].y}`) + row('상대: 초록·주황·노랑', `${sc[1].g} · ${sc[1].o} · ${sc[1].y}`);
  if (DIV === 'drive') h += row('집게', me.held ? '블록 잡음' : me.grip ? '닫힘' : '열림') + row('주행 파워', Math.round(me.power * 100) + '%') + `<div class="row"><span>스트라이커 힘</span><b>${Math.round(me.charge * 100)}%</b></div><div class="bar"><i style="width:${me.charge * 100}%"></i></div>`;
  else h += row('킥', 'RB 오른발 · LB 왼발 (누르고 있다 떼기)') + `<div class="row"><span>킥 힘</span><b>${Math.round(me.charge * 100)}%</b></div><div class="bar"><i style="width:${me.charge * 100}%"></i></div>`;
  const near = DIV === 'drive' ? me.wheels().filter(([x]) => Math.abs(x) < C.grey).length : 0;
  h += `<div class="msg">${G.phase === 'play' && near >= 2 ? `⚠ 바퀴 ${near}개가 회색 구역 — 4개 모두 들어가면 실격` : ''}</div>`;
  $('#side').innerHTML = h;
  $('#pad').classList.toggle('on', IN.pad); $('#padTxt').textContent = IN.pad ? '🎮 엑스박스 컨트롤러 연결됨' : '컨트롤러 없음 — 키보드 사용 (버튼을 한 번 누르면 연결)';
}
const KEYS = DIV === 'drive' ? [
  ['D패드 ↑ / ↓', '전진 · 후진 (기본 50%)', 'W / S'], ['D패드 ← / →', '포인트 턴', 'A / D'], ['D패드 대각선', '스윙턴', 'W·S + A·D'], ['RT', '누르는 동안 파워 100%', 'Shift'],
  ['A', '집게 닫기 / 열기 (블록을 잡고 다님)', 'E'], ['LT (누르고 있다가 떼기)', '스트라이커: 누르는 동안 힘을 모으고 떼면 블록을 칩니다', 'Space'], ['Y · View', '카메라', 'C'], ['Menu', '일시정지', 'P'],
] : [
  ['D패드 ↑ / ↓', '앞으로 · 뒤로 걷기 (150~154 / 155~159)', 'W / S'], ['D패드 ← / →', '제자리 돌기 (141 / 140)', 'A / D'], ['LT + D패드 ← / →', '옆걸음 (132 / 133)', 'Q / Z'], ['D패드 대각선', '대각선 걷기 (136~139)', 'W·S + A·D'],
  ['RB / LB (누르고 있다가 떼기)', '오른발 킥 (121) / 왼발 킥 (120) — 누르는 동안 힘을 모으고 떼면 발끝으로 블록을 칩니다', 'O / L'], ['Y · View', '카메라', 'C'], ['Menu', '일시정지', 'P'],
];
const keyTable = `<table class="k">${KEYS.map(([a, b, k]) => `<tr><td>${a}</td><td>${b} <span style="color:#8d93b5">[${k}]</span></td></tr>`).join('')}</table>`;
const RULES = `경기 2분 · 두 팀이 동시에 블록 10개씩 · 블록은 바닥을 미끄러지게 (던지기 금지) · 회색 구역에 블록을 보내 하우스(노랑 1 · 주황 3 · 초록 5 · 검정 50)에 · 검정 중심에 닿으면 즉시 승리(콜드게임) · 승부: 콜드게임 → 초록 수 → 주황 수 → 노랑 수 · 회색 구역에 ${DIV === 'drive' ? '바퀴 4개가 모두' : '두 발이 모두'} 들어가면 실격`;
$('#help').innerHTML = `<b>🎮 엑스박스 컨트롤러</b> [키보드]${keyTable}<p style="color:#c9cde6;margin:8px 0 0">${RULES}</p><p style="color:#8d93b5;margin:6px 0 0">블록과 매트 사이 마찰 등 공식 규정에 없는 값은 가정입니다.</p>`;
$('#helpBtn').addEventListener('click', () => $('#help').classList.toggle('on'));
$('#card').innerHTML = `<h1>${esc(P.get('title') || ('로봇 컬링 — ' + (DIV === 'drive' ? '드라이브' : '휴머노이드') + ' · 연습'))}</h1>
  <p>${DIV === 'drive' ? '바퀴 로봇(20 × 20 × 20 cm · 500 g 이내)을 조종해 집게로 블록을 잡고 스트라이커로 쳐서 하우스에 보냅니다.' : 'MAX-E1 휴머노이드를 조종해 블록 뒤로 걸어가 킥으로 블록을 하우스에 보냅니다.'}${P.get('opp') ? ` 상대 팀 <b style="color:#ffd25a">${esc(P.get('opp'))}</b>` : ''} · 상대 ${1 + Math.round(LEVEL * 4)}단계 / 5</p>
  <div class="cols"><div>${keyTable}</div><div><p class="note">${RULES}</p><p class="note">나는 빨강 진영(왼쪽), 상대는 파랑 진영(오른쪽)에서 동시에 진행합니다. 상대 블록을 쳐내는 테이크아웃도 됩니다.</p></div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="startBtn">경기 시작</button></div>`;
$('#startBtn').addEventListener('click', () => { $('#overlay').style.display = 'none'; setup(); view.focus(); });
function showEnd(res, sc, why) {
  const ov = $('#overlay'); ov.style.display = 'flex';
  $('#card').innerHTML = `<h1>${res === 'win' ? '승리!' : res === 'loss' ? '패배' : '무승부'}</h1><p>${esc(why)}</p>
    <table class="k res"><tr><td></td><td>초록 · 주황 · 노랑</td><td>기록 점수</td></tr><tr><td>나</td><td>${sc[0].g} · ${sc[0].o} · ${sc[0].y}</td><td>${sc[0].pts}</td></tr><tr><td>상대</td><td>${sc[1].g} · ${sc[1].o} · ${sc[1].y}</td><td>${sc[1].pts}</td></tr></table>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="again">다시 하기</button></div>`;
  $('#again').addEventListener('click', () => { ov.style.display = 'none'; setup(); view.focus(); });
}
$('#exit').addEventListener('click', () => post({ type: 'wrlsim:exit' })); if (!EMBED) $('#exit').style.display = 'none';
renderer.domElement.addEventListener('pointerdown', () => view.focus());
// 처음 화면에도 블록을 놓아 둠
for (const team of [0, 1]) { const s = team ? 1 : -1; for (let i = 0; i < C.nBlocks; i++) makeBlock(team, s * C.rowX, -0.18 + i * 0.04); }
$('#cam').textContent = '📷 ' + CAMNAME[camMode] + ' (C · Y)';
resize(); requestAnimationFrame(frame);
window.__cu = { G, me, op, robots, BLOCKS, C, tick, setup, score, AI, world, DR, slide: slideFriction };
post({ type: 'wrlsim:ready' });
</script>

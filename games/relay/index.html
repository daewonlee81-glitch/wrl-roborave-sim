<style>
:root{--bg:#1d2238;--panel:#262c47ee;--line:#454d74;--text:#eef0f8;--mute:#a7abc6;--gold:#ffd25a;--ok:#3fb950;--red:#e5483b;--blue:#2f6bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#view{position:absolute;inset:0;outline:none}
#view canvas{display:block;width:100%;height:100%}
.btn{background:#3a4166;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{background:#474f7a}
.btn.pri{background:linear-gradient(90deg,#ffd25a,#ff8f5a);color:#2a1d05;border-color:transparent}

#hud .clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

#exit{position:absolute;left:10px;top:10px;z-index:6}
#side{position:absolute;left:10px;top:52px;width:270px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;pointer-events:none}
#side .row{display:flex;justify-content:space-between;gap:6px;border-top:1px solid #ffffff10;padding:3px 0}
#side .row:first-child{border-top:0}
#side .ok{color:var(--ok)}#side .no{color:#8d93b5}#side .cur{color:var(--gold)}

#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,3vw,40px);font-weight:900;text-shadow:0 3px 12px #000;pointer-events:none;text-align:center;white-space:pre-line;opacity:0;transition:opacity .2s;max-width:92%}
#banner.show{opacity:1}
#pad{position:absolute;left:10px;bottom:10px;background:#0d1117e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
#pad i{width:9px;height:9px;border-radius:50%;background:#6e7681;display:inline-block}
#pad.on{border-color:var(--ok)} #pad.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#cam{position:absolute;right:10px;bottom:10px;background:#0d1117cc;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
#helpBtn{position:absolute;right:10px;top:10px;z-index:6}
#help{position:absolute;right:10px;top:52px;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:none;max-height:calc(100% - 110px);overflow:auto}
#help.on{display:block}
table.k{width:100%;border-collapse:collapse}
table.k td{border-bottom:1px solid #ffffff12;padding:4px 3px;vertical-align:top}
table.k td:first-child{color:var(--mute);white-space:nowrap;width:40%}
#overlay{position:absolute;inset:0;background:#0b0f14d0;display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.card{background:#2b3150;border:1px solid var(--line);border-radius:14px;padding:20px 24px;max-width:760px;box-shadow:0 20px 60px #000a;max-height:calc(100% - 20px);overflow:auto}
.card h1{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0;color:#d6d9ec}
.card .note{color:var(--mute);font-size:12px}
.card .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.legs label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:#353c63}
.legs input{margin-right:4px}
.legs label:has(input:checked){border-color:var(--gold);background:#4a4a3a}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as CANNON from 'cannon-es';
import { Bot, ATK } from '../humanoid/maxe1.js';

/* ============================================================
   휴머노이드 릴레이 (WRL) — 세부 규정이 아직 공개되지 않아 대회 사진을 바탕으로 만든 코스입니다 (치수 · 벌점: 가정)
   · U자 코스: 흰 레인 두 줄(폭 60 cm · 길이 4 m)이 가운데 빈 곳(50 cm)을 두고 나란히 있고 먼 끝에서 이어짐
   · 왼쪽 레인으로 가서 먼 끝의 파란 콘을 돌아(터치) 오른쪽 레인으로 돌아옴 · 4구간 릴레이 (MAX-E1 4대 얼라이언스)
   · 구간 경계(검은 상자 + 작은 주황 콘)에서 기다리던 다음 로봇이 앞 로봇이 오면 출발
   · 미션: 검은 막대 넘기(1 · 4구간) · 주사위를 파란 트레이 밖으로 옮기기(2구간) · 파란 콘 터치(3구간)
   · 넘어지면 스스로 일어서야 계속 · 레인 밖으로 떨어지면 그 구간 출발점으로
   · 기록 경기: 완주 시간 + 벌점(주사위 못 옮김 +15초 · 콘 터치 못 함 +10초) — 대진표에서는 가상 얼라이언스 기록보다 빨라야 승리
   ============================================================ */
const P = new URLSearchParams(location.search);
const EMBED = P.get('embed') === '1', MODE = P.get('mode') || 'practice';
const TARGET = +(P.get('target') || 0);
const post = m => { if (EMBED) try { parent.postMessage(Object.assign({ source: 'wrlsim' }, m), '*'); } catch (e) {} };
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- 코스 (미터, z = 레인 방향 · 먼 끝이 −z) ---------------- */
const C = {
  laneW: 0.60, gap: 0.50, len: 4.0, connD: 0.60, boardH: 0.018,
  bar: { h: 0.02, d: 0.03 },
  tray: { w: 0.20, d: 0.16, rim: 0.012, x: -0.40, z: -2.55 },
  dice: 0.035,
  cone: { x: 0, z: -4.30, r: 0.06, h: 0.30 },
  time: 300,
};
const LX = -(C.gap / 2 + C.laneW / 2), RX = -LX;           // 왼쪽 · 오른쪽 레인 가운데 x
const BARS = [{ x: LX, z: -0.80, leg: 0 }, { x: RX, z: -1.50, leg: 3 }];
// 구간: 출발 자리 · 끝(다음 로봇 자리) · 따라갈 길(가상 팀원)
const LEGS = [
  { name: '1구간', start: [LX - 0.08, -0.15, Math.PI / 2], end: [LX - 0.08, -1.60], path: [[LX - 0.08, -1.60]], mission: '막대 넘기' },
  { name: '2구간', start: [LX - 0.08, -1.60, Math.PI / 2], end: [LX - 0.13, -3.50], path: [[LX - 0.12, -2.25], ['dice'], [LX - 0.15, -2.30], [LX - 0.13, -2.80], [LX - 0.13, -3.50]], mission: '주사위 옮기기' },
  { name: '3구간', start: [LX - 0.13, -3.50, Math.PI / 2], end: [RX + 0.08, -3.00], path: [[LX + 0.05, -4.20], [C.cone.x - 0.16, C.cone.z + 0.02], ['cone'], [RX - 0.05, -4.20], [RX + 0.08, -3.00]], mission: '파란 콘 터치' },
  { name: '4구간', start: [RX + 0.08, -3.00, -Math.PI / 2], end: [RX + 0.08, -0.15], path: [[RX + 0.08, -0.15]], mission: '막대 넘기 · 결승' },
];
const onBoard = (x, z) => { // 흰 판 위인지
  const inL = Math.abs(x - LX) < C.laneW / 2 && z < 0.02 && z > -C.len - 0.01, inR = Math.abs(x - RX) < C.laneW / 2 && z < 0.02 && z > -C.len - 0.01;
  const inC = Math.abs(x) < C.gap / 2 + C.laneW && z <= -C.len + 0.01 && z > -C.len - C.connD;
  return inL || inR || inC;
};

/* ---------------- 장면 ---------------- */
const view = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9e2d4); scene.fog = new THREE.Fog(0xe9e2d4, 6, 16);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement); controls.enabled = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8a70, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1.0, 3.5, 0.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.4, right: 1.4, top: 2.8, bottom: -2.8, near: 0.5, far: 8 }); sun.target.position.set(0, 0, -2.2); scene.add(sun, sun.target);
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o));
const mesh = (geo, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };
{ // 나무 바닥 + 흰 판(레인 · 연결부)
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#c8a77a'; g.fillRect(0, 0, 512, 512); for (let i = 0; i < 32; i++) { g.fillStyle = i % 2 ? '#c09d6f' : '#cdae84'; g.fillRect(0, i * 16, 512, 15); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); t.colorSpace = THREE.SRGBColorSpace;
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ map: t, roughness: 0.7 })); fl.rotation.x = -Math.PI / 2; fl.position.z = -2; fl.receiveShadow = true; scene.add(fl);
  const white = mat(0xf7f8fa, { roughness: 0.25, metalness: 0.05 });
  mesh(new THREE.BoxGeometry(C.laneW, C.boardH, C.len), white, LX, C.boardH / 2, -C.len / 2);
  mesh(new THREE.BoxGeometry(C.laneW, C.boardH, C.len), white, RX, C.boardH / 2, -C.len / 2);
  mesh(new THREE.BoxGeometry(C.gap + 2 * C.laneW, C.boardH, C.connD), white, 0, C.boardH / 2, -C.len - C.connD / 2);
  const tape = mat(0x2f6bff); // 출발 · 결승 표시
  mesh(new THREE.BoxGeometry(C.laneW, 0.001, 0.02), tape, LX, C.boardH + 0.0005, -0.03);
  mesh(new THREE.BoxGeometry(C.laneW, 0.001, 0.02), mat(0xe5483b), RX, C.boardH + 0.0005, -0.03);
}
// 큰 주황 콘(가까운 끝 가운데) · 파란 콘(먼 끝, 터치 미션) · 구간 경계의 검은 상자 + 작은 주황 콘
function cone(x, z, r, h, col, y = 0) { const g = new THREE.Group(); g.position.set(x, y, z); mesh(new THREE.ConeGeometry(r, h, 24), mat(col, { roughness: 0.45 }), 0, h / 2, 0, g); mesh(new THREE.BoxGeometry(r * 2.2, 0.01, r * 2.2), mat(col), 0, 0.005, 0, g); scene.add(g); return g; }
cone(0, 0.25, 0.12, 0.45, 0xe8532c);
const blueCone = cone(C.cone.x, C.cone.z, C.cone.r, C.cone.h, 0x2f7cf0, C.boardH);
for (const L of LEGS.slice(1)) { const [x, z] = L.start, side = x < 0 ? -1 : 1, bx = (x < 0 ? LX : RX) + side * (C.laneW / 2 - 0.05); mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), mat(0x111114), bx, C.boardH + 0.045, z); cone(bx, z, 0.03, 0.07, 0xe8532c, C.boardH + 0.09); }
for (const [x, z] of [[LX - C.laneW / 2 + 0.05, -0.02], [RX + C.laneW / 2 - 0.05, -0.02]]) mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), mat(0x111114), x, C.boardH + 0.045, z);
for (const b of BARS) mesh(new THREE.BoxGeometry(C.laneW - 0.04, C.bar.h, C.bar.d), mat(0x16171b, { roughness: 0.4 }), b.x, C.boardH + C.bar.h / 2, b.z);
// 파란 트레이 + 노란 주사위
const trayG = new THREE.Group(); trayG.position.set(C.tray.x, C.boardH, C.tray.z); scene.add(trayG);
{ const m = mat(0x2a4fd0, { roughness: 0.5 }), T = C.tray, t = 0.006;
  mesh(new THREE.BoxGeometry(T.w, 0.004, T.d), m, 0, 0.002, 0, trayG);
  for (const [w, d, x, z] of [[T.w, t, 0, -T.d / 2], [T.w, t, 0, T.d / 2], [t, T.d, -T.w / 2, 0], [t, T.d, T.w / 2, 0]]) mesh(new THREE.BoxGeometry(w, T.rim, d), m, x, T.rim / 2, z, trayG); }
const diceMesh = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#ffd21f'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#1b1b1f'; g.font = 'bold 84px system-ui'; g.textAlign = 'center'; g.fillText('5', 64, 94);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.BoxGeometry(C.dice, C.dice, C.dice), new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 })); m.castShadow = true; scene.add(m); return m; })();

/* ---------------- 물리 (주사위 · 트레이 · 막대) ---------------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) }); world.solver.iterations = 20; world.allowSleep = true;
const mStatic = new CANNON.Material('s'), mDice = new CANNON.Material('d'), mBot = new CANNON.Material('b');
world.addContactMaterial(new CANNON.ContactMaterial(mStatic, mDice, { friction: 0.4, restitution: 0.1 }));
world.addContactMaterial(new CANNON.ContactMaterial(mBot, mDice, { friction: 0.2, restitution: 0, contactEquationStiffness: 2e6, contactEquationRelaxation: 4 }));
const sbox = (hx, hy, hz, x, y, z) => { const b = new CANNON.Body({ mass: 0, material: mStatic, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)) }); b.position.set(x, y, z); world.addBody(b); return b; };
const floorB = new CANNON.Body({ mass: 0, material: mStatic, shape: new CANNON.Plane() }); floorB.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(floorB);
sbox(C.laneW / 2, C.boardH / 2, C.len / 2, LX, C.boardH / 2, -C.len / 2); sbox(C.laneW / 2, C.boardH / 2, C.len / 2, RX, C.boardH / 2, -C.len / 2);
sbox(C.gap / 2 + C.laneW, C.boardH / 2, C.connD / 2, 0, C.boardH / 2, -C.len - C.connD / 2);
for (const b of BARS) sbox((C.laneW - 0.04) / 2, C.bar.h / 2, C.bar.d / 2, b.x, C.boardH + C.bar.h / 2, b.z);
{ const T = C.tray, t = 0.003, y = C.boardH; sbox(T.w / 2, 0.002, T.d / 2, T.x, y + 0.002, T.z);
  for (const [hx, hz, x, z] of [[T.w / 2, t, 0, -T.d / 2], [T.w / 2, t, 0, T.d / 2], [t, T.d / 2, -T.w / 2, 0], [t, T.d / 2, T.w / 2, 0]]) sbox(hx, T.rim / 2, hz, T.x + x, y + T.rim / 2, T.z + z); }
const diceB = new CANNON.Body({ mass: 0.02, material: mDice, shape: new CANNON.Box(new CANNON.Vec3(C.dice / 2, C.dice / 2, C.dice / 2)), linearDamping: 0.05, angularDamping: 0.2 });
world.addBody(diceB);
const resetDice = () => { diceB.position.set(C.tray.x + 0.02, C.boardH + 0.004 + C.dice / 2, C.tray.z); diceB.quaternion.set(0, 0, 0, 1); diceB.velocity.setZero(); diceB.angularVelocity.setZero(); diceB.wakeUp(); };
resetDice();
const diceOut = () => { const p = diceB.position, T = C.tray; return Math.abs(p.x - T.x) > T.w / 2 + 0.005 || Math.abs(p.z - T.z) > T.d / 2 + 0.005; };

/* ---------------- 로봇 (MAX-E1 4대) ---------------- */
let MYLEG = clamp(+(P.get('leg') || localStorage.getItem('wrlsim.relay.leg') || 1) - 1, 0, 3);
const SET = { autoUp: (() => { try { return localStorage.getItem('wrlsim.hb.autoUp') !== '0'; } catch (e) { return true; } })() };
const runners = LEGS.map((L, i) => {
  const b = new Bot(0, { scene, groundY: C.boardH, x: L.start[0], z: L.start[1], th: L.start[2], name: i === MYLEG ? '나' : 'AI ' + (i + 1) });
  const feet = ['Rf', 'Lf'].map(k => { const fb = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: mBot, shape: new CANNON.Sphere(0.016) }); fb.allowSleep = false; world.addBody(fb); return { k, b: fb }; });
  const body = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: mBot, shape: new CANNON.Cylinder(0.05, 0.05, 0.22, 12) }); body.allowSleep = false; world.addBody(body);
  return { i, b, feet, body, done: false, active: false, kick: null, ai: { st: 'go', wp: 0, t: 0 }, falls: 0, offT: 0 };
});
function relabel() { runners.forEach((r, i) => { const tag = r.b.m.tag; if (!tag) return; const c = tag.material.map.image, g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); g.fillStyle = i === MYLEG ? '#2f6bff' : '#5a6380'; g.beginPath(); g.roundRect(2, 2, 92, 44, 10); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'center'; const tx = i === MYLEG ? (window.WRL_I18N ? WRL_I18N.T('나') : '나') : 'AI ' + (i + 1); let fs = 26; g.font = `bold ${fs}px system-ui`; while (fs > 12 && g.measureText(tx).width > 86) { fs -= 2; g.font = `bold ${fs}px system-ui`; } g.fillText(tx, 48, 24 + fs * 0.36); tag.material.map.needsUpdate = true; }); }
relabel();
// 로봇 발 · 몸을 물리 세계에 맞춤: 지금 자리에서 속도로 움직이게 하고 계산 뒤 목표 자리에 맞춤 (주사위가 튕겨 날아가지 않게)
function physTargets(r, dt) {

  h += `<div class="msg">${G.phase === 'run' && G.leg < MYLEG ? `내 차례(${LEGS[MYLEG].name})를 기다리는 중…` : G.leg === MYLEG && me.fallen && !me.getup ? (SET.autoUp ? '⚠ 넘어짐! 곧 일어섭니다 (Y로 바로)' : '⚠ 넘어짐! Y 버튼(I 키)으로 일어서세요') : G.leg === MYLEG && BARS.some(q => Math.abs(q.z - me.z) < 0.3 && Math.abs(q.x - me.x) < 0.3) ? '막대 앞: 보통 걸음(RT 떼고)으로 넘으세요' : ''}</div>`;
  $('#side').innerHTML = h;
  $('#pad').classList.toggle('on', IN.pad); $('#padTxt').textContent = IN.pad ? '🎮 엑스박스 컨트롤러 연결됨' : '컨트롤러 없음 — 키보드 사용 (버튼을 한 번 누르면 연결)';
}
const KEYS = [
  ['D패드 ↑ / ↓', '앞 · 뒤로 걷기 (RT 누르면 빠르게)', 'W / S · Shift'], ['D패드 ← / →', '제자리 돌기', 'A / D'], ['LT + D패드 ← / →', '옆걸음', 'Q / E'], ['D패드 대각선', '대각선 걷기', 'W·S + A·D'],
  ['RB · LB', '오른발 · 왼발 킥 (주사위 차기)', 'O / L'], ['A · B · X', '펀치 · 오른팔 · 왼팔 (콘 터치)', 'J / K / U'], ['Y', '일어서기', 'I'], ['View · Menu', '카메라 · 일시정지', 'C / P'],
];
const keyTable = `<table class="k">${KEYS.map(([a, b, k]) => `<tr><td>${a}</td><td>${b} <span style="color:#8d93b5">[${k}]</span></td></tr>`).join('')}</table>`;
const RULES = `U자 코스(레인 폭 60 cm · 길이 4 m)를 MAX-E1 4대가 구간을 나눠 이어 달립니다. 1구간 검은 막대 넘기 → 2구간 파란 트레이의 주사위를 트레이 밖으로(킥) → 3구간 먼 끝 파란 콘 터치 · 돌기 → 4구간 막대 넘어 결승. 앞 로봇이 다음 로봇(구간 경계의 검은 상자 옆)에 닿으면 다음 로봇이 출발합니다. 막대는 빠른 걸음 · 대각선 · 옆걸음으로 넘으면 걸려 넘어지기 쉽습니다. 넘어지면 일어서야 계속, 레인 밖으로 떨어지면 그 구간 출발점으로. 기록 = 완주 시간 + 벌점(주사위 +15초 · 콘 +10초), 5분 제한.`;
$('#help').innerHTML = `<b>🎮 엑스박스 컨트롤러</b> [키보드]${keyTable}<p style="color:#c9cde6;margin:8px 0 0">${RULES}</p><p style="color:#8d93b5;margin:6px 0 0">세부 규정이 아직 공개되지 않아 대회 사진을 바탕으로 만든 코스입니다. 치수 · 벌점 · 넘어질 확률은 가정값입니다.</p>`;
$('#helpBtn').addEventListener('click', () => $('#help').classList.toggle('on'));
function startCard() {
  $('#card').innerHTML = `<h1>${esc(P.get('title') || '휴머노이드 릴레이 · 연습')}</h1>
  <p>MAX-E1 4대 얼라이언스. 내가 맡을 구간을 고르면 나머지 구간은 가상 팀원(AI)이 달립니다.${TARGET ? ` 목표 기록 <b style="color:#ffd25a">${TARGET}초</b> 안에 완주하면 승리.` : ''}${P.get('opp') ? ` 상대 얼라이언스 <b style="color:#ffd25a">${esc(P.get('opp'))}</b>` : ''}</p>
  <div class="legs">${LEGS.map((L, i) => `<label><input type="radio" name="leg" value="${i}" ${i === MYLEG ? 'checked' : ''}>${L.name} · ${L.mission}</label>`).join('')}</div>
  <div class="cols"><div>${keyTable}</div><div><p class="note">${RULES}</p><label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="autoUp" ${SET.autoUp ? 'checked' : ''}> 넘어지면 자동으로 일어서기 (1.2초 뒤) — 끄면 Y로 직접</label></div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="startBtn">경기 시작</button></div>`;
  for (const el of document.querySelectorAll('input[name=leg]')) el.addEventListener('change', e => { MYLEG = +e.target.value; try { localStorage.setItem('wrlsim.relay.leg', MYLEG + 1); } catch (_) {} relabel(); });
  $('#autoUp').addEventListener('change', e => { SET.autoUp = e.target.checked; try { localStorage.setItem('wrlsim.hb.autoUp', SET.autoUp ? '1' : '0'); } catch (_) {} });
  $('#startBtn').addEventListener('click', () => { $('#overlay').style.display = 'none'; setup(); view.focus(); });
}
function showEnd(total, win) {
  $('#overlay').style.display = 'flex';
  $('#card').innerHTML = `<h1>${total === null ? '시간 초과' : win ? '완주! ' + fmtT(total) : '완주 ' + fmtT(total)}</h1><p>구간 기록: ${G.legT.map((t, i) => `${LEGS[i].name} ${t.toFixed(1)}초`).join(' · ')}</p><p>벌점 ${G.pen}초 · 넘어짐 ${G.falls}번 · 레인 이탈 ${G.outs}번</p>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="again">다시 하기</button></div>`;
  $('#again').addEventListener('click', () => { startCard(); });
}
startCard();
$('#exit').addEventListener('click', () => post({ type: 'wrlsim:exit' })); if (!EMBED) $('#exit').style.display = 'none';
renderer.domElement.addEventListener('pointerdown', () => view.focus());
$('#cam').textContent = '📷 ' + CAMNAME[camMode] + ' (C · View)';
for (const r of runners) r.b.sync();
resize(); requestAnimationFrame(frame);
window.__rl = { G, runners, LEGS, C, tick, setup, diceB, diceOut, aiStep, onBoard, BARS, get MYLEG() { return MYLEG; }, set MYLEG(v) { MYLEG = v; relabel(); } };
post({ type: 'wrlsim:ready' });
</script>
</body>
</html>
